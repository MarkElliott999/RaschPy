schema_version: 1

context:
  version: "1.3.1"

package:
  name: raschpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/raschpy/raschpy-${{ version }}.tar.gz
  sha256: b78b6769296f74d610c038e4dbd3eb569f4f9fa771f6cb851cb6383014cdc641

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - pandas >=2.0
    - scipy >=1.9
    - scikit-learn >=1.1
    - matplotlib-base >=3.6
    - seaborn >=0.12
    - openpyxl >=3.0

tests:
  - python:
      imports:
        - raschpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/MarkElliott999/RaschPy
  summary: Rasch measurement in Python — SLM, PCM, RSM, and Many-Facet Rasch models
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://github.com/MarkElliott999/RaschPy

extra:
  recipe-maintainers:
    - MarkElliott999
