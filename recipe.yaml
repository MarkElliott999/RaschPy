schema_version: 1

context:
  version: "1.1.1"
  python_min: "3.10"

package:
  name: raschpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/raschpy/raschpy-${{ version }}.tar.gz
  sha256: f0414f3db4c24dd34911c096951aca007575fee458b125305aa81c007be61b75

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - pandas >=2.0
    - scipy >=1.9
    - scikit-learn >=1.1
    - matplotlib-base >=3.6
    - seaborn >=0.12
    - openpyxl >=3.0

tests:
  - python:
      imports:
        - raschpy
      pip_check: true

about:
  homepage: https://github.com/MarkElliott999/RaschPy
  summary: Rasch measurement in Python — SLM, PCM, RSM, and Many-Facet Rasch models
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://github.com/MarkElliott999/RaschPy

extra:
  recipe-maintainers:
    - MarkElliott999
